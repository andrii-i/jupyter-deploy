# Template for canary E2E testing of the eks-oidc template.
# CLI and template installed from prod PyPI, no version pins, no placeholders.
# The solver picks the latest compatible versions, same as a user running `pip install`.
# The pytest-jupyter-deploy harness comes from the checkout: the tests import their fixtures from it.
[project]
name = "e2e-eks-oidc-canary"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "jupyter-deploy[aws,k8s]",
    "jupyter-deploy-tf-aws-eks-oidc",
    "pytest-jupyter-deploy[ui]",
    "pytest-cov",
]

[tool.uv.sources]
pytest-jupyter-deploy = { path = "libs/pytest-jupyter-deploy", editable = true }
