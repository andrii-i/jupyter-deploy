name: E2E jupyterlab template test job

# Reusable NON-deployment test job for the aws-ec2-jupyterlab template. It restores the
# fresh deployment produced by the deploy job (by project ID, from the S3 store) and runs
# the E2E suite against it. The full_deployment tests are auto-skipped here (no
# --with-full-deployment on an existing project) — they run in the deploy job instead.
# jupyterlab needs only AWS creds (no OAuth app / subdomain / bot credentials), and has no
# masked secrets, so the restore is a plain jd init --restore-project (no --restore-secrets).
on:
  workflow_call:
    inputs:
      ecr-tag:
        description: "ECR image tag to pull (the pre-built E2E image)"
        required: true
        type: string
      ecr-slot:
        description: "ECR repo slot the image was pushed to (7=PR/dispatch, 8=release, 9=canary)"
        required: true
        type: string
      deployment-id:
        description: "Deployment id to restore from the S3 store (emitted by the deploy job)"
        required: true
        type: string
      project-dir:
        description: "Project directory to restore into (sandbox-*)"
        required: false
        type: string
        default: "sandbox-e2e"
      test-filter:
        description: "Pytest -k filter (empty = all non-deployment tests)"
        required: false
        type: string
        default: ""
      mutate:
        description: "Include mutating tests (they run `jd config` + `jd up` against the deployment)"
        required: false
        type: boolean
        default: false
      job-name:
        description: "Display name for the job (distinguishes the non-mutating and mutating passes)"
        required: false
        type: string
        default: "Run E2E tests"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 30
      ref:
        description: "Git ref to checkout (default: triggering ref)"
        required: false
        type: string
        default: ""

jobs:
  test:
    name: ${{ inputs.job-name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: e2e
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install UV and Python
        uses: ./.github/actions/install-uv
        with:
          python-version: "3.13"

      - name: Install just
        uses: ./.github/actions/install-just

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::997498698382:role/jupyter-infra-ci-e2e-6a3e2625
          aws-region: us-west-2
          role-duration-seconds: 7200

      # sandbox-ci provides the ECR repo URL + region for the image pull (no bot creds needed).
      - name: Restore CI project
        run: just ci-restore sandbox-ci

      - name: Pull pre-built E2E image
        run: just ci-e2e-base-pull ${{ inputs.ecr-slot }} ${{ inputs.ecr-tag }}

      - name: Restore deployment from store
        run: just ci-restore-jupyterlab ${{ inputs.project-dir }} ${{ inputs.deployment-id }}

      - name: Seed .env
        run: just env-setup-jupyterlab

      # Existing project + no --with-full-deployment ⇒ full_deployment tests auto-skip.
      # mutate=true additionally un-skips the @pytest.mark.mutating tests, which run
      # `jd config` + `jd up` in place against this same restored deployment.
      - name: Run E2E tests
        run: >-
          just test-e2e-jupyterlab ${{ inputs.project-dir }} "${{ inputs.test-filter }}"
          "skip-sync=true${{ inputs.mutate && ',mutate=true' || '' }}"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Distinct per pass: the non-mutating and mutating jobs both upload, and same-named
          # artifacts collide within a run.
          name: test-results-jupyterlab-${{ inputs.mutate && 'mutating' || 'non-mutating' }}
          path: test-results/
          if-no-files-found: ignore

      - name: Upload test results to S3
        if: failure()
        continue-on-error: true
        run: just ci-upload-test-results ${{ inputs.ecr-slot }}
