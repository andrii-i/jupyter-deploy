# Per-PR e2e for the eks-oidc template, run against the shared long-lived deployment.
# pull_request_target is what grants the AWS role to fork PRs, and e2e executes the
# PR's code, so nothing credentialed runs before the gate: PRs authored by org members
# and collaborators pass it automatically, anyone else waits for approval on the
# e2e-approval environment. Every job pins the PR head SHA from the triggering event,
# so an approved run tests exactly the approved code. The mutating job waits for
# e2e-approval for every author (it reconfigures the shared deployment). Runs
# serialize in the e2e-eks-4 group with the manual and fresh runs. Until a repo admin
# adds required reviewers to e2e-approval, GitHub auto-creates it with no rules and
# the gate passes without review; e2e-auto is deliberately rule-free.
name: E2E PR (eks-oidc template)

on:
  pull_request_target:

permissions:
  id-token: write
  contents: read

concurrency:
  group: e2e-eks-4
  cancel-in-progress: false

jobs:
  gate:
    name: "E2E gate"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    environment: ${{ contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) && 'e2e-auto' || 'e2e-approval' }}
    steps:
      - name: Gate cleared
        run: echo "e2e gate cleared (author association ${{ github.event.pull_request.author_association }})"

  build-image:
    name: "Build E2E image"
    needs: gate
    uses: ./.github/workflows/e2e-build-image.yml
    secrets: inherit
    with:
      oauth-app-num: "4"
      ref: ${{ github.event.pull_request.head.sha }}

  test-non-mutating:
    name: "Non-mutating tests"
    needs: build-image
    uses: ./.github/workflows/e2e-eks-oidc-job.yml
    secrets: inherit
    with:
      oauth-app-num: "4"
      ecr-tag: ${{ needs.build-image.outputs.ecr-tag }}
      ref: ${{ github.event.pull_request.head.sha }}
      timeout-minutes: 120

  approve-mutating:
    name: "Approval gate for mutating tests"
    needs: test-non-mutating
    runs-on: ubuntu-latest
    timeout-minutes: 1
    environment: e2e-approval
    steps:
      - name: Gate cleared
        run: echo "e2e-approval environment cleared — mutating tests may run"

  test-mutating:
    name: "Mutating tests"
    needs: [build-image, approve-mutating]
    uses: ./.github/workflows/e2e-eks-oidc-job.yml
    secrets: inherit
    with:
      oauth-app-num: "4"
      ecr-tag: ${{ needs.build-image.outputs.ecr-tag }}
      ref: ${{ github.event.pull_request.head.sha }}
      marker: mutating
      mutate: true
      timeout-minutes: 210
